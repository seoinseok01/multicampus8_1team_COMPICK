<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계정 설정 | COMPICK</title>
    <link rel="stylesheet" th:href="@{/css/member.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="page">
    <h1>로그인 정보 설정</h1>
    <p class="subtitle">구글 로그인뿐 아니라 아이디와 비밀번호로도 로그인할 수 있습니다.</p>
    <section class="card form-card">
        <h2>아이디 · 비밀번호</h2>
        <form th:action="@{/member/social-credentials}" th:object="${socialCredentialForm}" method="post">
            <div class="notice error" th:if="${#fields.hasGlobalErrors()}"
                 th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            <label>아이디
                <div class="input-action">
                    <input th:field="*{loginId}" placeholder="영문·숫자 4~20자" autocomplete="username">
                    <button type="button" class="secondary" id="checkId">중복 확인</button>
                </div>
                <small id="idResult"></small>
                <small class="error" th:errors="*{loginId}"></small>
            </label>
            <label>비밀번호
                <input type="password" th:field="*{password}" placeholder="영문·숫자·특수문자 포함 8자 이상" autocomplete="new-password">
                <small class="error" th:errors="*{password}"></small>
            </label>
            <label>비밀번호 확인
                <input type="password" th:field="*{passwordConfirm}" placeholder="비밀번호를 다시 입력" autocomplete="new-password">
                <small class="error" th:errors="*{passwordConfirm}"></small>
            </label>
            <button class="primary">설정하고 시작하기</button>
        </form>
    </section>
</main>
<script>
document.getElementById('checkId').onclick = async () => {
    const value = document.getElementById('loginId').value;
    const result = document.getElementById('idResult');
    if (!/^[A-Za-z0-9]{4,20}$/.test(value)) {
        result.textContent = '영문과 숫자 4~20자로 입력해 주세요.';
        result.className = 'error';
        return;
    }
    const available = await (await fetch('/member/check-login-id?loginId=' + encodeURIComponent(value))).json();
    result.textContent = available ? '사용 가능한 아이디입니다.' : '이미 사용 중인 아이디입니다.';
    result.className = available ? 'success' : 'error';
};
</script>
</body>
</html>
