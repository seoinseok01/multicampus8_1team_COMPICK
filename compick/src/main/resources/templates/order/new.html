<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>주문서 작성 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/member.css}">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<script src="https://js.tosspayments.com/v2/standard"></script>
	<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
	<script th:src="@{/js/order.js}" defer></script>
</head>
<body
	th:data-toss-configured="${tossConfigured}"
	th:data-toss-client-key="${tossClientKey}"
	th:data-customer-key="${customerKey}">
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="order-page">
		<section class="page-heading">
			<p>CHECKOUT</p>
			<h1>주문서 작성</h1>
			<span>배송지와 주문 상품을 확인하고 결제를 진행합니다.</span>
		</section>

		<div class="order-layout">
			<section class="order-content">
				<div class="order-section">
					<h2>배송지</h2>
					<div data-address-box></div>

					<div class="address-form-slide" data-address-form-slide>
						<form class="address-inline-form" data-address-form>
							<div class="address-form-grid">
								<label>
									배송지 이름
									<input type="text" name="addressName" maxlength="50" placeholder="예: 우리 집">
								</label>
								<label>
									받는 사람 <em>*</em>
									<input type="text" name="recipientName" maxlength="50" required>
								</label>
								<label>
									휴대전화 번호 <em>*</em>
									<input type="tel" name="phone" placeholder="010-1234-5678" required>
								</label>
								<label>
									우편번호 <em>*</em>
									<div class="field-with-button">
										<input type="text" name="zipCode" inputmode="numeric"
											maxlength="5" required readonly>
										<button type="button" data-address-search>주소 검색</button>
									</div>
								</label>
								<label class="address-form-wide">
									기본 주소 <em>*</em>
									<input type="text" name="address1" maxlength="255" required readonly>
								</label>
								<label class="address-form-wide">
									상세 주소
									<input type="text" name="address2" maxlength="255">
								</label>
							</div>
							<label class="address-form-default">
								<input type="checkbox" name="isDefault">
								기본 배송지로 설정
							</label>
							<p class="form-message" data-address-form-message role="status"></p>
							<div class="address-form-actions">
								<button type="button" class="secondary-button" data-address-form-cancel>취소</button>
								<button type="submit" class="primary-button">배송지 저장</button>
							</div>
						</form>
					</div>
				</div>

				<div class="order-section">
					<h2>주문 상품</h2>
					<ul class="cart-line-list" data-order-item-list></ul>
				</div>
			</section>

			<aside class="cart-summary-panel">
				<h2>최종 결제 금액</h2>
				<div class="cart-summary-row">
					<span>상품 금액</span>
					<strong data-product-amount>0원</strong>
				</div>
				<div class="cart-summary-row">
					<span>배송비</span>
					<strong>무료</strong>
				</div>
				<div class="cart-total-row">
					<span>총 결제 금액</span>
					<strong data-total-amount>0원</strong>
				</div>

				<label class="order-agree">
					<input type="checkbox" data-agree-checkbox>
					주문 내용과 결제에 동의합니다.
				</label>

				<button type="button" class="quote-submit-button" data-pay-button disabled>
					배송지 등록 후 결제하기
				</button>
			</aside>
		</div>
	</main>
	<p id="cart-feedback" class="cart-feedback" role="status" aria-live="polite" hidden></p>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
