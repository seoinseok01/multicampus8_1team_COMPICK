<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주문 내역 | COMPICK</title><link rel="stylesheet" th:href="@{/css/main.css}"><link rel="stylesheet" th:href="@{/css/member.css}"><link rel="stylesheet" th:href="@{/css/order-history.css}"></head>
<body><div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="page"><h1>주문 내역</h1><p class="subtitle">주문 상태와 결제 내역을 확인합니다.</p><div class="mypage-grid"><div th:replace="~{fragments/header :: mypage-menu('orders')}"></div><section><p class="notice success" th:if="${message}" th:text="${message}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p>
<article class="card empty-order" th:if="${#lists.isEmpty(orders)}"><h2>주문 내역이 없습니다.</h2><p class="muted">결제를 완료한 주문이 이곳에 표시됩니다.</p></article>
<article class="card order-history-card" th:each="order:${orders}"><header><div><time th:text="${#temporals.format(order.orderedAt,'yyyy.MM.dd HH:mm')}">2026.08.03</time><strong th:text="${order.orderNumber}">cp20260803001</strong></div><span class="status" th:classappend="${order.status.name().toLowerCase()}" th:text="${order.status.name() == 'PAYMENT_PENDING' ? '결제 대기' : order.status.name() == 'PAID' ? '결제 완료' : order.status.name() == 'PREPARING' ? '상품 준비 중' : order.status.name() == 'SHIPPING' ? '배송 중' : order.status.name() == 'DELIVERED' ? '배송 완료' : '주문 취소'}">결제 완료</span></header><div class="order-history-body"><div><small>받는 사람</small><b th:text="${order.recipientName}">이름</b></div><div><small>결제 금액</small><b class="amount" th:text="|${#numbers.formatInteger(order.finalAmount,0,'COMMA')}원|">0원</b></div><a class="detail-link" th:href="@{/orders/{number}(number=${order.orderNumber})}">주문 상세보기</a></div></article>
</section></div></main><div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
