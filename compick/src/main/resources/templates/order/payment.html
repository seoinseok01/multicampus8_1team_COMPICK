<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 | COMPICK</title><link rel="stylesheet" th:href="@{/css/main.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"><script src="https://js.tosspayments.com/v2/standard"></script><script th:src="@{/js/payment.js}" defer></script></head>
<body th:data-client-key="${tossClientKey}" th:data-customer-key="${customerKey}" th:data-order-id="${order.orderNumber}" th:data-order-name="${items.size() == 1 ? items[0].productName : items[0].productName + ' 외 ' + (items.size()-1) + '건'}" th:data-customer-name="${customerName}" th:data-amount="${order.finalAmount}"><div th:replace="~{fragments/header :: siteHeader}"></div><main class="checkout-page"><header class="page-title"><p>PAYMENT</p><h1>결제하기</h1><span th:text="|주문번호 ${order.orderNumber}|">주문번호</span></header><div class="checkout-grid"><section class="panel"><h2>배송지</h2><p><strong th:text="${order.recipientName}"></strong> · <span th:text="${order.recipientPhone}"></span></p><p th:text="|[${order.zipCode}] ${order.basicAddress} ${order.detailAddress ?: ''}|"></p><h2 class="space">주문 상품</h2><article class="simple-row" th:each="item:${items}"><span th:text="|${item.productName} × ${item.quantity}|"></span><b th:text="|${#numbers.formatInteger(item.lineAmount,0,'COMMA')}원|"></b></article></section><aside class="panel summary"><h2>최종 결제 금액</h2><div class="total"><span>결제 금액</span><strong th:text="|${#numbers.formatInteger(order.finalAmount,0,'COMMA')}원|"></strong></div><p class="alert" th:unless="${tossConfigured}">토스 API 키가 설정되지 않았습니다.</p><button id="payment-button" class="primary full" type="button" th:disabled="${!tossConfigured}">토스로 결제하기</button><small>결제창에서 테스트 카드 또는 간편결제를 선택할 수 있습니다.</small></aside></div></main><div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
