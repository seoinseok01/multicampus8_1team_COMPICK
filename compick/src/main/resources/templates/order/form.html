<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주문서 | COMPICK</title>
<link rel="stylesheet" th:href="@{/css/main.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head><body>
<div th:replace="~{fragments/header :: siteHeader}"></div><main class="checkout-page"><header class="page-title"><p>CHECKOUT</p><h1>주문서 작성</h1><span>배송지와 주문 상품을 확인해 주세요.</span></header>
<p class="alert" th:if="${error}" th:text="${error}"></p><form th:action="@{/orders}" th:object="${orderRequest}" method="post" class="checkout-grid">
<div><section class="panel"><div class="section-title"><b>01</b><h2>배송지</h2></div>
<div th:if="${!#lists.isEmpty(addresses)}" class="address-list"><label class="address-option" th:each="address:${addresses}">
<input type="radio" th:field="*{addressId}" th:value="${address.id}"><span><strong th:text="${address.addressName}">배송지</strong><em th:if="${address.default}">기본 배송지</em><b th:text="${address.recipientName}">이름</b><small th:text="${address.recipientPhone}">전화</small><span th:text="|[${address.zipCode}] ${address.basicAddress} ${address.detailAddress ?: ''}|">주소</span></span></label></div>
<div class="new-address" th:classappend="${#lists.isEmpty(addresses)} ? 'required'"><h3 th:text="${#lists.isEmpty(addresses)} ? '배송지를 입력해 주세요' : '새 배송지 사용'">새 배송지</h3>
<p th:unless="${#lists.isEmpty(addresses)}">새 주소를 사용하려면 아래 내용을 입력하고 ‘새 배송지 사용’을 선택하세요.</p>
<label th:unless="${#lists.isEmpty(addresses)}" class="inline-check"><input type="radio" th:field="*{addressId}" value=""> 새 배송지 사용</label>
<div class="form-grid"><label>배송지명<input th:field="*{addressName}" placeholder="집, 회사"></label><label>받는 사람<input th:field="*{recipientName}"></label><label>연락처<input th:field="*{recipientPhone}" placeholder="010-0000-0000"></label>
<label>우편번호<span class="input-action"><input th:field="*{zipCode}"><button type="button" onclick="findAddress()">주소 검색</button></span></label><label class="wide">기본 주소<input th:field="*{basicAddress}"></label><label class="wide">상세 주소<input th:field="*{detailAddress}"></label></div>
<label class="inline-check"><input type="checkbox" th:field="*{saveAddress}"> 회원 배송지에 저장</label><label class="inline-check"><input type="checkbox" th:field="*{defaultAddress}"> 기본 배송지로 설정</label></div>
<label class="request">배송 요청사항<input th:field="*{deliveryRequest}" placeholder="배송 전 연락 부탁드립니다."></label></section>
<section class="panel"><div class="section-title"><b>02</b><h2>주문 상품</h2></div><article class="product-row" th:each="item:${checkout.items}"><img th:src="${item.imageUrl != null and !item.imageUrl.isBlank()} ? ${item.imageUrl} : @{/images/products/product-placeholder.svg}" alt=""><div><small th:text="${item.brand}"></small><strong th:text="${item.name}"></strong><span th:text="|수량 ${item.quantity}개|">수량</span></div><b th:text="|${#numbers.formatInteger(item.lineAmount,0,'COMMA')}원|"></b></article></section></div>
<aside class="panel summary"><div class="section-title"><b>03</b><h2>결제 금액</h2></div><dl><div><dt>상품 금액</dt><dd th:text="|${#numbers.formatInteger(checkout.productAmount,0,'COMMA')}원|"></dd></div><div><dt>배송비</dt><dd>무료</dd></div></dl><div class="total"><span>총 결제 금액</span><strong th:text="|${#numbers.formatInteger(checkout.finalAmount,0,'COMMA')}원|"></strong></div><button class="primary full" type="submit">주문 생성 후 결제하기</button></aside></form>
</main><div th:replace="~{fragments/footer :: siteFooter}"></div><script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script><script>function findAddress(){new daum.Postcode({oncomplete:d=>{zipCode.value=d.zonecode;basicAddress.value=d.roadAddress||d.jibunAddress;detailAddress.focus();}}).open();}</script></body></html>
