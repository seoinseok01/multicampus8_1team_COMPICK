<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>
            마이페이지 | COMPICK
        </title>
        <link rel="stylesheet" th:href="@{/css/main.css}">
        <link rel="stylesheet" th:href="@{/css/member.css}">
    </head>
    <body>
        <div th:replace="~{fragments/header :: siteHeader}">
        </div>
        <main class="page">
            <h1>
                마이페이지
            </h1>
            <p class="subtitle">
                회원정보, 배송지와 최근 주문을 확인합니다.
            </p>
            <div class="mypage-grid">
                <div th:replace="~{fragments/header :: mypage-menu('profile')}">
                </div>
                <section>
                    <div class="notice success" th:if="${message}" th:text="${message}">
                    </div>
                    <div class="notice error" th:if="${error}" th:text="${error}">
                    </div>
                    <article class="card profile-summary">
                        <div class="avatar">
                        </div>
                        <div>
                            <h2 th:text="${member.name}">
                                이름
                            </h2>
                            <p>
                                <span th:text="${member.loginId}">
                                </span>
                                ·
                                <span th:text="${member.email}">
                                </span>
                            </p>
                        </div>
                        <a class="secondary button" th:href="@{/mypage/profile}">
                            회원정보 수정
                        </a>
                    </article>
                    <h2>
                        최근 주문
                    </h2>
                    <article class="card">
                        <p class="muted">
                            아직 주문 내역이 없습니다.
                        </p>
                    </article>
                    <h2>
                        기본 배송지
                    </h2>
                    <article class="card" th:if="${!addresses.isEmpty()}">
                        <strong th:text="${addresses[0].recipientName + ' · ' + addresses[0].recipientPhone}">
                        </strong>
                        <p th:text="${addresses[0].basicAddress + ' ' + (addresses[0].detailAddress ?: '')}">
                        </p>
                    </article>
                    <article class="card" th:if="${addresses.isEmpty()}">
                        <p class="muted">
                            등록된 배송지가 없습니다.
                        </p>
                    </article>
                    <section id="withdraw" class="card danger-zone">
                        <h2>
                            회원 탈퇴
                        </h2>
                        <form th:action="@{/mypage/withdraw}" method="post">
                            <input type="password" name="password" placeholder="현재 비밀번호" required>
                            <button class="danger" onclick="return confirm('정말 탈퇴하시겠습니까?')">
                                회원 탈퇴
                            </button>
                        </form>
                    </section>
                </section>
            </div>
        </main>
        <script th:if="${phoneMissing}">
            alert(
                '전화번호가 등록되지 않았습니다.\n' +
                '[마이페이지] > [회원정보]에서 전화번호를 등록해주세요.'
            );
        </script>
        <div th:replace="~{fragments/footer :: siteFooter}"></div>
    </body>
</html>
