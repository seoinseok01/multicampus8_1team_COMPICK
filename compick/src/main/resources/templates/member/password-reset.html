<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>
            비밀번호 재설정 | COMPICK
        </title>
        <link rel="stylesheet" th:href="@{/css/member.css}">
    </head>
    <body>
        <div th:replace="~{fragments/header :: header}">
        </div>
        <main class="page">
            <h1>
                비밀번호 재설정
            </h1>
            <p class="subtitle">
                아이디와 가입 이메일을 인증한 뒤 새 비밀번호를 설정합니다.
            </p>
            <section class="card narrow">
                <div class="notice success" th:if="${message}" th:text="${message}">
                </div>
                <div class="notice error" th:if="${error}" th:text="${error}">
                </div>
                <form th:action="@{/members/password-reset/send}" method="post">
                    <label>
                        아이디
                        <input name="loginId" required placeholder="아이디 입력">
                    </label>
                    <label>
                        이메일
                        <input type="email" name="email" required placeholder="가입 이메일">
                    </label>
                    <button class="secondary full">
                        인증번호 전송
                    </button>
                </form>
                <hr>
                <form th:action="@{/members/password-reset/confirm}" method="post">
                    <label>
                        인증번호
                        <input name="code" inputmode="numeric" maxlength="6" required placeholder="6자리 인증번호">
                    </label>
                    <label>
                        새 비밀번호
                        <input type="password" name="newPassword" required placeholder="영문·숫자·특수문자 8자 이상">
                    </label>
                    <label>
                        새 비밀번호 확인
                        <input type="password" name="newPasswordConfirm" required placeholder="새 비밀번호를 다시 입력">
                    </label>
                    <button class="primary">
                        비밀번호 변경
                    </button>
                </form>
                <p class="links">
                    <a th:href="@{/login}">
                        로그인으로 돌아가기
                    </a>
                </p>
            </section>
        </main>
    </body>
</html>
