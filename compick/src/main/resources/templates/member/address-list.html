<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>
            배송지 관리 | COMPICK
        </title>
        <link rel="stylesheet" th:href="@{/css/member.css}">
    </head>
    <body>
        <div th:replace="~{fragments/header :: header}">
        </div>
        <main class="page">
            <h1>
                배송지 관리
            </h1>
            <p class="subtitle">
                배송지를 등록하고 기본 배송지를 설정합니다.
            </p>
            <div class="mypage-grid">
                <div th:replace="~{fragments/header :: mypage-menu('address')}">
                </div>
                <section>
                    <div class="section-title">
                        <h2 th:text="'등록된 배송지 ' + ${addresses.size()} + '개'">
                        </h2>
                        <a class="primary button" th:href="@{/mypage/addresses/new}">
                            새 배송지 등록
                        </a>
                    </div>
                    <div class="notice success" th:if="${message}" th:text="${message}">
                    </div>
                    <article class="card address" th:each="a:${addresses}">
                        <div>
                            <h3>
                                <span th:text="${a.addressName}">
                                </span>
                                <em th:if="${a.default}" class="badge">
                                    기본 배송지
                                </em>
                            </h3>
                            <p th:text="${a.recipientName + ' · ' + a.recipientPhone}">
                            </p>
                            <p class="muted" th:text="${'(' + a.zipCode + ') ' + a.basicAddress + ' ' + (a.detailAddress ?: '')}">
                            </p>
                        </div>
                        <div class="row">
                            <a class="secondary button" th:href="@{/mypage/addresses/{id}/edit(id=${a.id})}">
                                수정
                            </a>
                            <form th:action="@{/mypage/addresses/{id}/delete(id=${a.id})}" method="post">
                                <button class="link danger-text" onclick="return confirm('이 배송지를 삭제하시겠습니까?')">
                                    삭제
                                </button>
                            </form>
                        </div>
                    </article>
                    <article class="card" th:if="${addresses.isEmpty()}">
                        <p class="muted">
                            등록된 배송지가 없습니다.
                        </p>
                    </article>
                </section>
            </div>
        </main>
    </body>
</html>
