<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>
            회원정보 수정 | COMPICK
        </title>
        <link rel="stylesheet" th:href="@{/css/member.css}">
    </head>
    <body>
        <div th:replace="~{fragments/header :: header}">
        </div>
        <main class="page">
            <h1>
                회원정보 수정
            </h1>
            <p class="subtitle">
                이름, 휴대전화와 비밀번호를 관리합니다.
            </p>
            <div class="notice success" th:if="${message}" th:text="${message}">
            </div>
            <section class="card form-card">
                <h2>
                    회원 정보
                </h2>
                <form th:action="@{/mypage/profile}" th:object="${profileForm}" method="post">
                    <div class="notice error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}">
                    </div>
                    <label>
                        이름
                        <input th:field="*{name}">
                        <small class="error" th:errors="*{name}">
                        </small>
                    </label>
                    <label>
                        휴대전화
                        <input th:field="*{phone}" placeholder="010-0000-0000">
                        <small class="error" th:errors="*{phone}">
                        </small>
                    </label>
                    <div class="actions">
                        <a class="secondary button" th:href="@{/mypage}">
                            취소
                        </a>
                        <button class="primary">
                            수정 완료
                        </button>
                    </div>
                </form>
            </section>
            <section class="card form-card">
                <h2>
                    비밀번호 변경
                </h2>
                <form th:action="@{/mypage/password}" th:object="${passwordForm}" method="post">
                    <div class="notice error" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}">
                    </div>
                    <label>
                        현재 비밀번호
                        <input type="password" th:field="*{currentPassword}">
                    </label>
                    <label>
                        새 비밀번호
                        <input type="password" th:field="*{newPassword}">
                        <small class="error" th:errors="*{newPassword}">
                        </small>
                    </label>
                    <label>
                        새 비밀번호 확인
                        <input type="password" th:field="*{newPasswordConfirm}">
                    </label>
                    <button class="secondary">
                        비밀번호 변경
                    </button>
                </form>
            </section>
        </main>
    </body>
</html>
