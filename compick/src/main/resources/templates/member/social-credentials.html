<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>
            Google 회원가입 | COMPICK
        </title>
        <link rel="stylesheet" th:href="@{/css/main.css}">
        <link rel="stylesheet" th:href="@{/css/member.css}">
    </head>
    <body>
        <div th:replace="~{fragments/header :: siteHeader}">
        </div>
        <main class="page">
            <h1>
                Google 회원가입
            </h1>
            <p class="subtitle">
                회원 관리에 사용할 비밀번호를 설정해 주세요.
            </p>
            <section class="card form-card">
                <h2>
                    비밀번호 설정
                </h2>
                <form th:action="@{/members/social-password}" th:object="${socialCredentialForm}" method="post">
                    <div class="notice error" th:if="${#fields.hasGlobalErrors()}"
                 th:each="error : ${#fields.globalErrors()}" th:text="${error}">
                    </div>
                    <label>
                        비밀번호
                        <input type="password" th:field="*{password}"
                       placeholder="영문·숫자·특수문자 포함 8자 이상" autocomplete="new-password">
                        <small class="error" th:errors="*{password}">
                        </small>
                    </label>
                    <label>
                        비밀번호 확인
                        <input type="password" th:field="*{passwordConfirm}"
                       placeholder="비밀번호를 다시 입력" autocomplete="new-password">
                        <small class="error" th:errors="*{passwordConfirm}">
                        </small>
                    </label>
                    <label class="check">
                        <input type="checkbox" th:field="*{termsAccepted}" required>
                        이용약관과
                        <a class="policy-link" style="color:#2563eb;text-decoration:underline"
                   th:href="@{/privacy-policy}" target="privacyPolicy"
                   onclick="window.open(this.href,'privacyPolicy','width=760,height=820,scrollbars=yes');return false;">
                            개인정보 처리방침
                        </a>
                        에 동의합니다.
                    </label>
                    <small class="error" th:errors="*{termsAccepted}">
                    </small>
                    <button type="submit" class="primary">
                        가입하고 시작하기
                    </button>
                </form>
            </section>
        </main>
        <div th:replace="~{fragments/footer :: siteFooter}"></div>
    </body>
</html>
