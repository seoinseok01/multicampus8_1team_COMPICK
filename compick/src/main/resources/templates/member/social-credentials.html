<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Google 회원가입 완료 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/member.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="member-page">
		<section class="member-card" aria-labelledby="credentials-title">
			<h1 id="credentials-title">Google 회원가입</h1>
			<p>
				Google 계정 연결이 완료되었습니다.
				회원 관리에 사용할 비밀번호를 설정해 주세요.
			</p>

			<form class="member-form"
				th:action="@{/members/social-password}"
				th:object="${socialCredentialForm}"
				method="post">
				<div class="form-message error"
					th:if="${#fields.hasGlobalErrors()}">
					<p th:each="error : ${#fields.globalErrors()}"
						th:text="${error}"></p>
				</div>

				<label for="password">비밀번호</label>
				<input id="password" th:field="*{password}"
					type="password" autocomplete="new-password" required>
				<small class="field-error" th:errors="*{password}"></small>

				<label for="passwordConfirm">비밀번호 확인</label>
				<input id="passwordConfirm" th:field="*{passwordConfirm}"
					type="password" autocomplete="new-password" required>
				<small class="field-error"
					th:errors="*{passwordConfirm}"></small>

				<label class="check-label">
					<input type="checkbox" th:field="*{termsAccepted}">
					이용약관 및 개인정보 처리방침에 동의합니다.
				</label>
				<small class="field-error"
					th:errors="*{termsAccepted}"></small>

				<button class="primary-button" type="submit">
					가입하고 시작하기
				</button>
			</form>
		</section>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
