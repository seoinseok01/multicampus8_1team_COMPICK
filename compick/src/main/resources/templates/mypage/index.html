<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>마이페이지 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/member.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="mypage">
		<h1>마이페이지</h1>
		<p class="subtitle">회원정보, 배송지와 최근 주문을 확인합니다.</p>
		<p class="form-message success" th:if="${message}" th:text="${message}"></p>
		<p class="form-message error" th:if="${error}" th:text="${error}"></p>

		<div class="mypage-layout">
			<div th:replace="~{fragments/mypage-sidebar :: mypageSidebar('profile')}"></div>

			<div class="mypage-content">
				<section class="profile-card">
					<div class="profile-avatar" th:text="${#strings.substring(member.nickname(), 0, 1)}">C</div>
					<div class="profile-card-body">
						<h2 th:text="${member.nickname()}">닉네임</h2>
						<p th:text="|${member.loginId()} · ${member.maskedEmail()}|"></p>
					</div>
					<a class="secondary-button" th:href="@{/mypage/profile}">회원정보 수정</a>
				</section>

				<section class="summary-section" aria-labelledby="recent-order-title">
					<h2 id="recent-order-title">최근 주문</h2>
					<div class="summary-card" th:if="${recentOrder != null}">
						<div>
							<strong th:text="${recentOrder.title}"></strong>
							<p th:text="|${recentOrder.orderNumber} · ${#numbers.formatInteger(recentOrder.finalAmount, 0, 'COMMA')}원|"></p>
						</div>
						<span class="status-label" th:text="${recentOrder.statusLabel}"></span>
					</div>
					<p class="summary-empty" th:if="${recentOrder == null}">아직 주문한 내역이 없습니다.</p>
				</section>

				<section class="summary-section" aria-labelledby="default-address-title">
					<h2 id="default-address-title">기본 배송지</h2>
					<div class="summary-card" th:if="${defaultAddress != null}">
						<div>
							<strong th:text="|${defaultAddress.recipientName} · ${defaultAddress.phone}|"></strong>
							<p th:text="|${defaultAddress.address1} ${defaultAddress.address2 ?: ''}|"></p>
						</div>
					</div>
					<p class="summary-empty" th:if="${defaultAddress == null}">등록된 배송지가 없습니다.</p>
				</section>

				<section class="withdraw-section" id="withdraw-section" aria-labelledby="withdraw-title">
					<h2 id="withdraw-title">회원 탈퇴</h2>
					<p>
						탈퇴하면 로그인할 수 없습니다.
						본인 확인을 위해 현재 비밀번호를 입력해 주세요.
					</p>
					<form th:action="@{/mypage/withdraw}" method="post"
						onsubmit="return confirm('정말 탈퇴하시겠습니까?');">
						<label for="withdraw-password">현재 비밀번호</label>
						<input id="withdraw-password" name="password"
							type="password" autocomplete="current-password" required>
						<button type="submit">회원 탈퇴</button>
					</form>
				</section>
			</div>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
	<script th:if="${phoneMissing}">
		window.alert("전화번호를 입력해주세요!");
	</script>
</body>
</html>
