<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>마이페이지 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/member.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="mypage">
		<h1>마이페이지</h1>
		<p class="form-message success" th:if="${message}" th:text="${message}"></p>
		<p class="form-message error" th:if="${error}" th:text="${error}"></p>
		<section class="profile-summary">
			<h2 th:text="|${member.nickname()}님, 안녕하세요.|">회원님, 안녕하세요.</h2>
			<dl>
				<div><dt>아이디</dt><dd th:text="${member.loginId()}"></dd></div>
				<div><dt>이메일</dt><dd th:text="${member.email()}"></dd></div>
				<div><dt>휴대전화</dt><dd th:text="${member.phone()}"></dd></div>
			</dl>
		</section>
		<nav class="mypage-menu" aria-label="마이페이지 메뉴">
			<a th:href="@{/mypage/profile}">회원정보 수정</a>
			<a th:href="@{/mypage/addresses}">
				배송지 관리
				<span th:text="|(${#lists.size(addresses)})|">(0)</span>
			</a>
			<a th:href="@{/orders}">주문 내역</a>
		</nav>
		<section class="withdraw-section" aria-labelledby="withdraw-title">
			<h2 id="withdraw-title">회원 탈퇴</h2>
			<p>
				탈퇴하면 로그인할 수 없습니다.
				본인 확인을 위해 현재 비밀번호를 입력해 주세요.
			</p>
			<form th:action="@{/mypage/withdraw}" method="post"
				onsubmit="return confirm('정말 탈퇴하시겠습니까?');">
				<label for="withdraw-password">현재 비밀번호</label>
				<input id="withdraw-password" name="password"
					type="password" autocomplete="current-password" required>
				<button type="submit">회원 탈퇴</button>
			</form>
		</section>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
	<script th:if="${phoneMissing}">
		window.alert("전화번호를 입력해주세요!");
	</script>
</body>
</html>
