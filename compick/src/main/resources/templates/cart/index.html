<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>장바구니 | COMPICK</title><link rel="stylesheet" th:href="@{/css/main.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head><body>
<div th:replace="~{fragments/header :: siteHeader}"></div><main class="checkout-page">
<header class="page-title"><p>SHOPPING CART</p><h1>장바구니</h1><span>선택한 부품을 확인하고 주문을 진행하세요.</span></header>
<section class="panel" th:if="${#lists.isEmpty(checkout.items)}"><div class="empty"><h2>장바구니가 비어있습니다.</h2><p>상품을 먼저 담아주세요.</p></div></section>
<div class="checkout-grid" th:unless="${#lists.isEmpty(checkout.items)}"><section class="panel"><h2>담은 상품</h2>
<article class="product-row" th:each="item:${checkout.items}"><img th:src="${item.imageUrl != null and !item.imageUrl.isBlank()} ? ${item.imageUrl} : @{/images/products/product-placeholder.svg}" alt="">
<div><small th:text="${item.brand}">브랜드</small><strong th:text="${item.name}">상품명</strong><span th:text="|수량 ${item.quantity}개|">수량</span></div><b th:text="|${#numbers.formatInteger(item.lineAmount,0,'COMMA')}원|">0원</b></article></section>
<aside class="panel summary"><h2>결제 예정 금액</h2><dl><div><dt>상품 금액</dt><dd th:text="|${#numbers.formatInteger(checkout.productAmount,0,'COMMA')}원|">0원</dd></div><div><dt>배송비</dt><dd>무료</dd></div></dl>
<div class="total"><span>총 결제 금액</span><strong th:text="|${#numbers.formatInteger(checkout.finalAmount,0,'COMMA')}원|">0원</strong></div><a class="primary full" th:href="@{/orders/new}">주문하기</a></aside></div>
</main><div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
