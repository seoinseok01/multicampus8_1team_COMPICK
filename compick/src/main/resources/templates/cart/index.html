<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>장바구니 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/cart.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>

	<main class="cart-page">
		<header class="cart-title">
			<p>CART</p>
			<h1>장바구니</h1>
			<span>담아둔 상품을 확인하고 주문을 진행해 주세요.</span>
		</header>

		<section class="empty-cart" th:if="${#lists.isEmpty(cart.items)}">
			<div aria-hidden="true">PC</div>
			<h2>장바구니가 비어 있습니다</h2>
			<p>원하는 부품을 골라 나만의 PC를 완성해 보세요.</p>
			<a th:href="@{/}">상품 둘러보기</a>
		</section>

		<div class="cart-layout" th:unless="${#lists.isEmpty(cart.items)}">
			<section class="cart-items" aria-labelledby="cart-items-title">
				<header>
					<h2 id="cart-items-title">담은 상품</h2>
					<span th:text="|${#lists.size(cart.items)}개 상품|">0개 상품</span>
				</header>
				<article class="cart-item" th:each="item : ${cart.items}">
					<input type="checkbox" th:checked="${item.selected}" aria-label="상품 선택">
					<img th:src="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)
						? item.imageUrl : '/images/products/product-placeholder.svg'}"
						th:alt="|${item.productName} 상품 이미지|">
					<div>
						<small th:text="${item.brand}">브랜드</small>
						<h3 th:text="${item.productName}">상품명</h3>
						<p th:text="${item.modelName}">모델명</p>
						<span th:text="|수량 ${item.quantity}개|">수량 1개</span>
					</div>
					<strong th:text="|${#numbers.formatInteger(item.lineAmount, 0, 'COMMA')}원|">0원</strong>
				</article>
			</section>

			<aside class="cart-summary">
				<h2>결제 예정 금액</h2>
				<dl>
					<div><dt>상품 금액</dt><dd th:text="|${#numbers.formatInteger(cart.productAmount, 0, 'COMMA')}원|">0원</dd></div>
					<div><dt>배송비</dt><dd th:text="${cart.shippingFee == 0 ? '무료' : #numbers.formatInteger(cart.shippingFee, 0, 'COMMA') + '원'}">무료</dd></div>
				</dl>
				<p><span>총 결제 금액</span><strong th:text="|${#numbers.formatInteger(cart.totalAmount, 0, 'COMMA')}원|">0원</strong></p>
				<a th:href="@{/orders/new}">주문하기</a>
			</aside>
		</div>
	</main>

	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
