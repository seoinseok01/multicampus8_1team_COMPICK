<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI 견적 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="ai-quote-page">
		<section class="ai-quote-hero">
			<p>AI PC BUILDER</p>
			<h1>어떤 PC가 필요한지<br>편하게 이야기해 주세요</h1>
			<span>예산과 용도를 분석해 어울리는 부품 구성을 제안해 드립니다.</span>
		</section>

		<section class="ai-builder" aria-labelledby="ai-builder-title">
			<div class="ai-builder-copy">
				<span class="ai-badge">COMPICK AI</span>
				<h2 id="ai-builder-title">원하는 조건을 알려주세요</h2>
				<p>구체적으로 입력할수록 더 정확한 견적을 받을 수 있습니다.</p>
				<ul>
					<li>주로 사용하는 프로그램이나 게임</li>
					<li>생각하고 있는 전체 예산</li>
					<li>선호하는 브랜드 또는 꼭 필요한 기능</li>
				</ul>
			</div>
			<form class="ai-request-form">
				<label for="ai-purpose">어떤 용도로 사용하시나요?</label>
				<textarea id="ai-purpose" rows="7"
					placeholder="예: 150만원 정도로 배틀그라운드를 즐기고 영상 편집도 할 수 있는 조용한 PC가 필요해요."></textarea>
				<div class="suggestion-chips" aria-label="입력 예시">
					<button type="button">게임용 150만원</button>
					<button type="button">영상 편집용</button>
					<button type="button">조용한 사무용</button>
				</div>
				<div class="budget-row">
					<label for="ai-budget">예산</label>
					<select id="ai-budget">
						<option>예산을 선택해 주세요</option>
						<option>100만원 이하</option>
						<option>100만원 ~ 150만원</option>
						<option>150만원 ~ 200만원</option>
						<option>200만원 이상</option>
					</select>
				</div>
				<button class="ai-submit-button" type="button">AI 견적 만들기</button>
				<small>현재는 화면 예시이며 추천 기능은 추후 제공됩니다.</small>
			</form>
		</section>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
