<!DOCTYPE html>
<html lang="ko"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
	<header th:fragment="siteHeader" class="site-header">
		<nav class="main-navigation" aria-label="주요 메뉴">
			<a class="site-logo" th:href="@{/}">COMPICK</a>

			<ul class="main-menu">
				<li><a th:href="@{/products}">부품 쇼핑</a></li>
				<li><a th:href="@{/quotes/new}">견적 쇼핑</a></li>
				<li><a th:href="@{/recommendations}">추천 견적</a></li>
				<li><a th:href="@{/ai-quotes}">AI 견적</a></li>
			</ul>

			<form class="header-search" th:action="@{/products}" method="get" role="search">
				<label for="header-keyword" hidden>상품 검색</label>
				<input
					id="header-keyword"
					name="keyword"
					type="search"
					placeholder="상품명 또는 제조사 검색">
				<button type="submit" hidden>검색</button>
			</form>

			<ul class="member-menu">
				<li><a th:href="@{/cart}">장바구니</a></li>
				<li sec:authorize="isAuthenticated()">
					<a th:href="@{/mypage}">마이페이지</a>
				</li>
				<li sec:authorize="isAnonymous()">
					<a th:href="@{/login}">로그인</a>
				</li>
				<li sec:authorize="isAuthenticated()">
					<form th:action="@{/logout}" method="post">
						<button type="submit">로그아웃</button>
					</form>
				</li>
			</ul>
		</nav>
	</header>

	<aside th:fragment="mypage-menu(active)" class="side-menu">
		<h2>마이페이지</h2>
		<a th:classappend="${active == 'profile'} ? 'active'" th:href="@{/mypage}">
			회원정보
		</a>
		<a th:classappend="${active == 'address'} ? 'active'" th:href="@{/mypage/addresses}">
			배송지 관리
		</a>
		<a th:href="@{/orders}">주문 내역</a>
	</aside>
</body>
</html>
