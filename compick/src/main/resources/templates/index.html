<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>
            COMPICK
        </title>
        <link rel="stylesheet" th:href="@{/css/member.css}">
    </head>
    <body>
        <div th:replace="~{fragments/header :: header}">
        </div>
        <main class="page">
            <section class="hero">
                <h1>
                    나에게 꼭 맞는 PC를
                    <br>
                    쉽게 골라보세요.
                </h1>
                <p>
                    부품 쇼핑부터 AI 견적까지, COMPICK이 함께합니다.
                </p>
                <a class="primary inline" th:href="@{/members/signup}">
                    시작하기
                </a>
            </section>
        </main>
        <script th:if="${phoneMissing}">
            alert(
                '전화번호가 등록되지 않았습니다.\n' +
                '[마이페이지] > [회원정보]에서 전화번호를 등록해주세요.'
            );
        </script>
    </body>
</html>
