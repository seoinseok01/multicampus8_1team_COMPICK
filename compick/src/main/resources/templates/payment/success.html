<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>결제 완료 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/payment-result.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="payment-result">
		<section>
			<div class="result-icon success">✓</div>
			<p class="result-label">PAYMENT COMPLETE</p>
			<h1>결제가 완료되었습니다</h1>
			<p>COMPICK을 이용해 주셔서 감사합니다.</p>
			<dl>
				<div><dt>주문번호</dt><dd th:text="${orderId}">COMPICK-ORDER</dd></div>
				<div><dt>결제수단</dt><dd th:text="${method ?: '결제수단'}">카드</dd></div>
				<div><dt>결제상태</dt><dd th:text="${status ?: 'DONE'}">DONE</dd></div>
				<div><dt>결제금액</dt><dd th:text="|${#numbers.formatInteger(amount, 0, 'COMMA')}원|">0원</dd></div>
			</dl>
			<div class="result-actions">
				<a th:href="@{/}">홈으로</a>
				<a class="primary" th:href="@{/mypage}">주문 내역 보기</a>
			</div>
		</section>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
