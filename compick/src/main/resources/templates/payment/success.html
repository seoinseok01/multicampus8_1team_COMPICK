<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 완료 | COMPICK</title><link rel="stylesheet" th:href="@{/css/main.css}"><link rel="stylesheet" th:href="@{/css/checkout.css}"></head><body><div th:replace="~{fragments/header :: siteHeader}"></div><main class="checkout-page result"><section class="panel"><div class="result-icon">✓</div><h1>결제가 완료되었습니다</h1><p>주문이 정상적으로 접수되었습니다.</p><dl><div><dt>주문번호</dt><dd th:text="${orderId}"></dd></div><div><dt>결제금액</dt><dd th:text="|${#numbers.formatInteger(amount,0,'COMMA')}원|"></dd></div><div><dt>결제수단</dt><dd th:text="${method}"></dd></div></dl><a class="primary" th:href="@{/orders/{number}(number=${orderId})}">주문 상세보기</a></section></main><div th:replace="~{fragments/footer :: siteFooter}"></div></body></html>
