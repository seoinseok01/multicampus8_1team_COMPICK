spring.application.name=compick
server.port=8787

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCL
spring.datasource.username=MULTI
spring.datasource.password=MULTI

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.thymeleaf.cache=false

# Gemini AI recommendation
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:models/gemini-3.6-flash}
gemini.product-resource=classpath:ai/compick-products.csv
gemini.system-prompt-resource=classpath:ai/system-prompt.txt

# log: 인증번호를 애플리케이션 로그에 출력, smtp: 실제 HTML 메일 발송
compick.mail.mode=${COMPICK_MAIL_MODE:log}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
