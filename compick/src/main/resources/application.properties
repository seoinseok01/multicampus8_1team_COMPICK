spring.application.name=compick
server.port=${SERVER_PORT:8787}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCL}
spring.datasource.username=${DB_USERNAME:MULTI}
spring.datasource.password=${DB_PASSWORD:MULTI}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

toss.payments.client-key=${TOSS_CLIENT_KEY:}
toss.payments.secret-key=${TOSS_SECRET_KEY:}
toss.payments.confirm-url=https://api.tosspayments.com/v1/payments/confirm

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Gemini AI recommendation
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:models/gemini-3.6-flash}
gemini.product-resource=classpath:shopping/ai/compick-products.csv
gemini.system-prompt-resource=classpath:shopping/ai/system-prompt.txt
