## application
spring.application.name=compick
server.port = 8787

# Oracle DB
spring.datasource.url= jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username= ${DB_USERNAME:COMPICK}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

#JPA 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Thymeleaf 개발 설정
spring.thymeleaf.cache=false

# Gemini AI 견적 추천
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:models/gemini-3.6-flash}
gemini.product-resource=classpath:shopping/ai/compick-products.csv
gemini.system-prompt-resource=classpath:shopping/ai/system-prompt.txt
