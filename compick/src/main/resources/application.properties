## application
spring.application.name=compick
server.port = 8787

# Oracle DB
spring.datasource.url= jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username= ${DB_USERNAME:COMPICK}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

#JPA 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Thymeleaf 개발 설정
spring.thymeleaf.cache=false

# Gemini AI 견적 추천
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:models/gemini-3.6-flash}
gemini.product-resource=classpath:shopping/ai/compick-products.csv
gemini.system-prompt-resource=classpath:shopping/ai/system-prompt.txt

# 카카오페이 단건결제 (cid 기본값 TC0ONETIME은 카카오가 공개한 테스트용 가맹점 코드)
kakaopay.secret-key=${KAKAO_PAY_SECRET_KEY:}
kakaopay.cid=${KAKAO_PAY_CID:TC0ONETIME}

# 토스페이먼츠 V2 결제창 (개별 연동 테스트 키)
toss.payments.client-key=${TOSS_CLIENT_KEY:}
toss.payments.secret-key=${TOSS_SECRET_KEY:}
