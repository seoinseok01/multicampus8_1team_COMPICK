<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추천견적 관리 | COMPICK</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('presets')}"></aside><main class="admin-main">
<header class="admin-page-head"><h1 th:text="${preset==null?'추천견적 등록':'추천견적 수정'}"></h1></header><p class="admin-message" th:if="${message}" th:text="${message}"></p>
<form method="post" enctype="multipart/form-data" th:action="@{/admin/presets/save}"><input type="hidden" name="id" th:value="${preset?.quoteId}"><div class="admin-grid">
<section class="admin-panel"><h2>기본 정보</h2><div class="admin-field"><label>추천견적명</label><input class="admin-input" name="quoteName" required th:value="${preset?.quoteName}"></div><div class="admin-field admin-field-gap"><label>용도</label><select class="admin-select" name="purposeTag"><option value="OFFICE" th:selected="${preset!=null and preset.purposeTag?.name()=='OFFICE'}">사무용</option><option value="GAMING" th:selected="${preset==null or preset.purposeTag?.name()=='GAMING'}">게이밍</option><option value="VIDEO_EDIT" th:selected="${preset!=null and preset.purposeTag?.name()=='VIDEO_EDIT'}">영상 편집</option><option value="BEGINNER" th:selected="${preset!=null and preset.purposeTag?.name()=='BEGINNER'}">입문용</option></select></div><div class="admin-field admin-field-gap"><label>한 줄 설명</label><textarea class="admin-textarea" name="summaryDescription" maxlength="200" th:text="${preset?.summaryDescription}"></textarea></div><div class="admin-field admin-field-gap"><label>대표 이미지</label><input type="hidden" name="imageUrl" th:value="${preset?.imageUrl}"><label class="admin-dropzone admin-preset-dropzone" id="preset-dropzone" for="preset-image"><input id="preset-image" type="file" name="imageFile" accept="image/png,image/jpeg,image/webp,image/gif"><img id="preset-preview" th:src="${preset?.imageUrl}" th:classappend="${preset?.imageUrl==null or preset?.imageUrl==''}?' is-empty'" alt="추천견적 이미지"><span><b>이미지를 끌어 놓거나 클릭해 선택</b><small>JPG, PNG, WEBP, GIF</small></span></label></div></section>
<section class="admin-panel"><h2>구성 부품</h2><div class="admin-product-picker"><div class="admin-product-row" th:each="category:${categories}"><label th:text="${category.categoryName}"></label><select class="admin-select" name="productId" required><option value="">상품 선택</option><option th:each="item:${products}" th:if="${item.category.categoryId==category.categoryId}" th:value="${item.productId}" th:text="${item.productName}" th:selected="${selected.containsKey(item.productId)}"></option></select><input class="admin-input" type="number" name="quantity" min="1" th:value="${selectedQuantity.get(category.categoryName)?:1}" aria-label="수량"></div></div></section></div>
<div class="admin-actions"><a class="admin-button secondary" th:href="@{/admin/presets}">취소</a><button class="admin-button" type="submit">저장</button></div></form>
<script>const input=document.querySelector('#preset-image'),zone=document.querySelector('#preset-dropzone'),preview=document.querySelector('#preset-preview');function showImage(file){if(!file||!file.type.startsWith('image/'))return;const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;preview.src=URL.createObjectURL(file);preview.classList.remove('is-empty')}input.addEventListener('change',()=>showImage(input.files[0]));['dragenter','dragover'].forEach(type=>zone.addEventListener(type,event=>{event.preventDefault();zone.classList.add('is-dragging')}));['dragleave','drop'].forEach(type=>zone.addEventListener(type,event=>{event.preventDefault();zone.classList.remove('is-dragging')}));zone.addEventListener('drop',event=>showImage(event.dataTransfer.files[0]));</script>
</main></div></body></html>
