<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>관리자 대시보드 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<div class="admin-shell">
		<aside th:replace="~{admin/fragments :: sidebar('dashboard')}"></aside>
		<main class="admin-main">
			<header class="admin-page-head">
				<div><h1>대시보드</h1><small>오늘의 운영 현황을 한눈에 확인하세요.</small></div>
			</header>

			<div class="admin-dashboard-grid">
				<section class="admin-dashboard-card admin-dashboard-sales">
					<header><div><span class="admin-dashboard-icon">₩</span><p>오늘 매출</p></div><small>결제·배송 주문 기준</small></header>
					<strong th:text="|${#numbers.formatInteger(todaySales,1,'COMMA')}원|">0원</strong>
					<p class="admin-dashboard-help">결제 대기와 취소 주문을 제외한 오늘 주문 금액입니다.</p>
					<a class="admin-dashboard-link" th:href="@{/admin/orders}">주문 내역 확인 <span>→</span></a>
				</section>

				<section class="admin-dashboard-card">
					<header><div><span class="admin-dashboard-icon stock">!</span><p>재고 부족</p></div><strong th:text="|${lowStockCount}건|">0건</strong></header>
					<div class="admin-dashboard-list">
						<a th:each="product:${lowStockProducts}" th:href="@{/admin/products(id=${product.productId},tab='register')}">
							<span th:text="${product.productName}"></span><b th:text="|${product.stockQuantity}개|"></b>
						</a>
						<p class="admin-dashboard-empty" th:if="${#lists.isEmpty(lowStockProducts)}">재고가 부족한 상품이 없습니다.</p>
					</div>
					<a class="admin-dashboard-link" th:href="@{/admin/products(tab='list')}">상품 관리 <span>→</span></a>
				</section>

				<section class="admin-dashboard-card">
					<header><div><span class="admin-dashboard-icon order">↻</span><p>최근 주문</p></div><strong th:text="|${todayOrders}건|">0건</strong></header>
					<div class="admin-dashboard-list">
						<a th:each="row:${recentOrders}" th:href="@{/admin/orders/{number}(number=${row.order.orderNumber})}">
							<span><b th:text="${row.order.orderNumber}"></b><small th:text="${row.memberName}"></small></span>
							<em class="admin-badge" th:classappend="${row.order.orderStatus}" th:text="${row.order.orderStatus}"></em>
						</a>
						<p class="admin-dashboard-empty" th:if="${#lists.isEmpty(recentOrders)}">최근 주문이 없습니다.</p>
					</div>
					<a class="admin-dashboard-link" th:href="@{/admin/orders}">전체 주문 확인 <span>→</span></a>
				</section>

				<section class="admin-dashboard-card admin-dashboard-return">
					<header><div><span class="admin-dashboard-icon return">↩</span><p>반품 요청</p></div><strong th:text="|${returnRequestCount}건|">0건</strong></header>
					<div class="admin-dashboard-list">
						<a th:each="row:${returnRequests}" th:href="@{/admin/orders/{number}(number=${row.order.orderNumber})}">
							<span><b th:text="${row.order.orderNumber}"></b><small th:text="${row.memberName}"></small></span>
							<em class="admin-badge RETURN_REQUESTED">RETURNED</em>
						</a>
						<p class="admin-dashboard-empty" th:if="${#lists.isEmpty(returnRequests)}">접수된 반품 요청이 없습니다.</p>
					</div>
					<a class="admin-dashboard-link" th:href="@{/admin/orders(returnRequested=true)}">반품 내역 확인 <span>→</span></a>
				</section>
			</div>
		</main>
	</div>
</body>
</html>
