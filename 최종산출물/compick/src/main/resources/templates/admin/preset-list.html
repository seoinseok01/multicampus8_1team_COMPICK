<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추천견적 관리 | COMPICK</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('presets')}"></aside><main class="admin-main"><header class="admin-page-head"><h1>추천견적 관리</h1><a class="admin-button" th:href="@{/admin/presets/new}">+ 새 추천견적</a></header><p class="admin-message" th:if="${message}" th:text="${message}"></p>
<div class="admin-toolbar"><a class="admin-button" th:classappend="${purpose==''}?'':'secondary'" th:href="@{/admin/presets}">전체</a><a class="admin-button secondary" th:href="@{/admin/presets(purpose='OFFICE')}">사무용</a><a class="admin-button secondary" th:href="@{/admin/presets(purpose='GAMING')}">게이밍</a><a class="admin-button secondary" th:href="@{/admin/presets(purpose='VIDEO_EDIT')}">영상 편집</a><a class="admin-button secondary" th:href="@{/admin/presets(purpose='BEGINNER')}">입문용</a></div>
<section class="admin-card-list"><article class="admin-card" th:each="preset:${presets}"><img class="admin-preset-card-image" th:if="${preset.imageUrl!=null and !#strings.isEmpty(preset.imageUrl)}" th:src="${preset.imageUrl}" alt="추천견적 이미지"><span class="admin-badge" th:text="${preset.purposeTag}"></span><h3 th:text="${preset.quoteName}"></h3><p th:text="${preset.summaryDescription}"></p><strong th:text="|구성 부품 ${#lists.size(preset.items)}종|"></strong><div class="admin-card-actions"><a class="admin-link" th:href="@{/admin/presets/{id}/edit(id=${preset.quoteId})}">수정</a><form method="post" th:action="@{/admin/presets/{id}/delete(id=${preset.quoteId})}" onsubmit="return confirm('추천견적을 삭제할까요?')"><button class="admin-link admin-delete-link" type="submit">삭제</button></form></div></article></section><p class="admin-empty" th:if="${#lists.isEmpty(presets)}">등록된 추천견적이 없습니다.</p>
</main></div></body></html>
