<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>회원정보 수정 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/member.css}">
	<script th:src="@{/js/member.js}" defer></script>
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="mypage">
		<h1>회원정보 수정</h1>
		<p class="subtitle">이메일, 닉네임과 비밀번호를 관리합니다.</p>

		<div class="mypage-layout">
			<div th:replace="~{fragments/mypage-sidebar :: mypageSidebar('profile')}"></div>

			<section class="account-card mypage-content" aria-labelledby="profile-title">
				<h2 id="profile-title">계정 정보</h2>
				<form class="member-form" th:action="@{/mypage/profile}"
					th:object="${profileForm}" method="post">
					<div class="form-message error" th:if="${#fields.hasGlobalErrors()}">
						<p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
					</div>

					<label for="loginId">아이디</label>
					<input id="loginId" type="text" th:value="${member.loginId()}" readonly>

					<label for="email">이메일</label>
					<input id="email" th:field="*{email}" type="email" required>
					<small class="field-error" th:errors="*{email}"></small>

					<label for="nickname">닉네임</label>
					<input id="nickname" th:field="*{nickname}" type="text" required>
					<small class="field-error" th:errors="*{nickname}"></small>

					<label for="phone">휴대전화 번호</label>
					<input id="phone" th:field="*{phone}" type="tel" required>
					<small class="field-error" th:errors="*{phone}"></small>

					<button class="secondary-button password-toggle" type="button" data-password-toggle>
						비밀번호 변경
					</button>

					<div class="password-section" data-password-section>
						<label for="currentPassword">현재 비밀번호</label>
						<input id="currentPassword" th:field="*{currentPassword}" type="password">
						<small class="field-error" th:errors="*{currentPassword}"></small>

						<label for="newPassword">새 비밀번호</label>
						<input id="newPassword" th:field="*{newPassword}" type="password">
						<small class="field-error" th:errors="*{newPassword}"></small>

						<label for="newPasswordConfirm">새 비밀번호 확인</label>
						<input id="newPasswordConfirm" th:field="*{newPasswordConfirm}" type="password">
					</div>

					<div class="form-actions">
						<a class="secondary-button" th:href="@{/mypage}">취소</a>
						<button class="primary-button" type="submit">수정 완료</button>
					</div>
				</form>
			</section>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
