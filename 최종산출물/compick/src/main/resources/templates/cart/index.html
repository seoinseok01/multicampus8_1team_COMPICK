<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>장바구니 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<script th:src="@{/js/cart.js}" defer></script>
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="cart-page">
		<section class="page-heading">
			<p>CART</p>
			<h1>장바구니</h1>
			<span>단일 부품과 완성된 견적서를 구분해 확인하고 구매합니다.</span>
		</section>

		<div class="cart-layout">
			<section class="cart-content">
				<div class="cart-section">
					<div class="cart-section-header">
						<h2>단일 부품</h2>
					</div>
					<label class="cart-select-all">
						<input type="checkbox" data-select-all-products>
						전체 선택
					</label>
					<ul class="cart-line-list" data-product-list></ul>
					<p class="cart-empty-message" data-product-empty hidden>담긴 부품이 없습니다.</p>
				</div>

				<div class="cart-section">
					<div class="cart-section-header">
						<h2>견적서</h2>
					</div>
					<label class="cart-select-all">
						<input type="checkbox" data-select-all-quotes>
						전체 선택
					</label>
					<ul class="cart-quote-list" data-quote-list></ul>
					<p class="cart-empty-message" data-quote-empty hidden>담긴 견적이 없습니다.</p>
				</div>
			</section>

			<aside class="cart-summary-panel">
				<h2>결제 금액</h2>
				<div class="cart-summary-row">
					<span>선택 상품 금액</span>
					<strong data-selected-amount>0원</strong>
				</div>
				<div class="cart-summary-row">
					<span>배송비</span>
					<strong>무료</strong>
				</div>
				<div class="cart-summary-row">
					<span>할인</span>
					<strong>0원</strong>
				</div>
				<div class="cart-total-row">
					<span>총 결제 금액</span>
					<strong data-total-amount>0원</strong>
				</div>
				<button type="button" class="quote-submit-button" data-checkout-button disabled>
					선택 상품 주문하기
				</button>
			</aside>
		</div>

		<p class="loading-indicator" data-loading-indicator hidden>불러오는 중...</p>
	</main>
	<p id="cart-feedback" class="cart-feedback" role="status" aria-live="polite" hidden></p>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
