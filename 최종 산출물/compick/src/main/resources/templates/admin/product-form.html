<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>상품 관리 | COMPICK</title><link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('products')}"></aside><main class="admin-main">
<header class="admin-page-head"><div><h1>상품 관리</h1><small>상품 정보와 판매 상태를 관리합니다.</small></div></header>
<p class="admin-message" th:if="${message}" th:text="${message}"></p>
<p class="admin-message admin-message-error" th:if="${error}" th:text="${error}"></p>
<nav class="admin-content-tabs" aria-label="상품 관리 메뉴">
  <a th:href="@{/admin/products(tab='register')}" th:classappend="${activeTab=='register'}?' is-active'">상품등록</a>
  <a th:href="@{/admin/products(tab='list')}" th:classappend="${activeTab=='list'}?' is-active'">상품조회</a>
</nav>
<form class="admin-product-form" method="post" enctype="multipart/form-data" th:action="@{/admin/products}" th:if="${activeTab=='register'}">
  <input type="hidden" name="id" th:value="${product?.productId}">
  <div class="admin-grid">
    <section class="admin-panel"><h2>기본 정보</h2><div class="admin-form-grid">
      <div class="admin-field wide"><label for="product-category">카테고리</label><select id="product-category" class="admin-select" name="categoryId" required><option th:each="item:${categories}" th:value="${item.categoryId}" th:text="${item.categoryName}" th:attr="data-category=${item.categoryName}" th:selected="${product!=null and product.category.categoryId==item.categoryId}"></option></select></div>
      <div class="admin-field wide"><label>상품명</label><input class="admin-input" name="productName" required th:value="${product?.productName}"></div>
      <div class="admin-field"><label>브랜드</label><input class="admin-input" name="brand" required th:value="${product?.brand}"></div>
      <div class="admin-field"><label>모델명</label><input class="admin-input" name="modelName" required th:value="${product?.modelName}"></div>
      <div class="admin-field"><label>가격</label><input class="admin-input" type="number" min="1000" step="100" name="price" required th:value="${product?.price?:1000}"></div>
      <div class="admin-field"><label>재고 수량</label><input class="admin-input" type="number" min="0" name="stockQuantity" required th:value="${product?.stockQuantity?:0}"></div>
      <div class="admin-field wide"><label>판매 상태</label><select class="admin-select" name="salesStatus"><option value="ON_SALE" th:selected="${product==null or product.salesStatus=='ON_SALE'}">판매중</option><option value="OFF_SALE" th:selected="${product!=null and product.salesStatus=='OFF_SALE'}">미판매</option></select></div>
      <div class="admin-field wide"><label>상품 설명</label><textarea class="admin-textarea" name="productDescription" th:text="${product?.productDescription}"></textarea></div>
    </div></section>
    <section class="admin-panel"><h2>이미지 및 상세 스펙</h2>
      <div class="admin-field"><label>상품 이미지</label><input type="hidden" name="imageUrl" th:value="${product?.imageUrl}"><label class="admin-dropzone" id="image-dropzone" for="image-file"><input id="image-file" type="file" name="imageFile" accept="image/png,image/jpeg,image/webp,image/gif"><img id="image-preview" th:src="${product?.imageUrl}" th:classappend="${product?.imageUrl==null or product?.imageUrl==''}?' is-empty'" alt="상품 이미지 미리보기"><span><b>이미지를 끌어 놓거나 클릭해 선택</b><small>JPG, PNG, WEBP, GIF</small></span></label></div>
      <div class="admin-spec-section"><h3>상세 스펙</h3><p>카테고리에 맞는 항목만 입력하세요.</p><div id="spec-fields" class="admin-form-grid"></div></div>
    </section>
  </div>
  <div class="admin-actions"><a class="admin-button secondary" th:href="@{/admin/products}">취소</a><button class="admin-button" type="submit">저장</button></div>
</form>
<section class="admin-panel admin-product-list-panel" th:if="${activeTab=='list'}"><header class="admin-section-head"><h2>등록 상품 조회</h2><form class="admin-product-search" method="get" th:action="@{/admin/products}"><input type="hidden" name="tab" value="list"><input class="admin-input" name="keyword" th:value="${keyword}" placeholder="상품명, 브랜드, 모델명 검색"><select class="admin-select" name="category"><option value="">전체 카테고리</option><option th:each="item:${categories}" th:value="${item.categoryName}" th:text="${item.categoryName}" th:selected="${selectedCategory==item.categoryName}"></option></select><button class="admin-button">조회</button></form></header>
  <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>상품명</th><th>카테고리</th><th>가격</th><th>재고</th><th>판매 상태</th><th>관리</th></tr></thead><tbody><tr th:each="row:${products}"><td th:text="${row.productName}"></td><td th:text="${row.category.categoryName}"></td><td th:text="|${#numbers.formatInteger(row.price,1,'COMMA')}원|"></td><td th:text="${row.stockQuantity}"></td><td><span class="admin-badge" th:text="${row.salesStatus=='ON_SALE'?'판매중':'미판매'}"></span></td><td><a class="admin-link" th:href="@{/admin/products(id=${row.productId},tab='register')}">수정</a></td></tr></tbody></table></div><p class="admin-empty" th:if="${#lists.isEmpty(products)}">조건에 맞는 상품이 없습니다.</p>
  <nav class="admin-pagination" th:if="${totalPages > 1}" aria-label="상품 목록 페이지">
    <a th:classappend="${currentPage == 1}?' is-disabled'" th:href="@{/admin/products(tab='list',page=${currentPage-1},keyword=${keyword},category=${selectedCategory})}">이전</a>
    <a th:each="number:${pageNumbers}" th:classappend="${number == currentPage}?' is-active'" th:text="${number}" th:href="@{/admin/products(tab='list',page=${number},keyword=${keyword},category=${selectedCategory})}"></a>
    <a th:classappend="${currentPage == totalPages}?' is-disabled'" th:href="@{/admin/products(tab='list',page=${currentPage+1},keyword=${keyword},category=${selectedCategory})}">다음</a>
  </nav>
</section>
<script id="saved-specs" type="application/json" th:if="${activeTab=='register'}" th:text="${specsJson}"></script>
<script th:if="${activeTab=='register'}">
const savedSpecs=JSON.parse(document.querySelector('#saved-specs').textContent||'{}');
const specDefinitions={
 CPU:[{key:'Socket',label:'소켓',options:['AM4','AM5','LGA1200','LGA1700','LGA1851']},{key:'Core Count',label:'코어 수'},{key:'Core Clock',label:'기본 클럭'},{key:'Boost Clock',label:'부스트 클럭'},{key:'Microarchitecture',label:'아키텍처'},{key:'TDP',label:'소비전력(TDP)'}],
 CPU_COOLER:[{key:'Type',label:'쿨러 방식',options:['Air','Liquid']},{key:'Radiator',label:'라디에이터 크기',liquidOnly:true},{key:'Color',label:'색상'}],
 MAINBOARD:[{key:'Socket',label:'CPU 소켓',options:['AM4','AM5','LGA1200','LGA1700','LGA1851']},{key:'Memory Type',label:'메모리 규격',options:['DDR4','DDR5']},{key:'Memory Slots',label:'메모리 슬롯 수',options:['2','4','8']},{key:'Memory Max',label:'메모리 최대 용량',options:['64 GB','128 GB','192 GB','256 GB']},{key:'Form Factor',label:'폼팩터',options:['Mini ITX','Micro ATX','ATX','EATX']},{key:'Color',label:'색상'}],
 RAM:[{key:'Modules',label:'제품 구성'},{key:'Speed',label:'동작 속도'},{key:'Color',label:'색상'}],
 GPU:[{key:'Chipset',label:'GPU 칩셋'},{key:'Memory',label:'그래픽 메모리'},{key:'Core Clock',label:'코어 클럭'},{key:'Boost Clock',label:'부스트 클럭'},{key:'Length',label:'길이'},{key:'Color',label:'색상'}],
 STORAGE:[{key:'Type',label:'저장장치 종류',options:['SSD','HDD']},{key:'Capacity',label:'용량'},{key:'Form Factor',label:'폼팩터',options:['M.2-2280','2.5\"','3.5\"']}],
 POWER_SUPPLY:[{key:'Wattage',label:'정격 출력'},{key:'Efficiency',label:'효율 등급',options:['80+ White','80+ Bronze','80+ Silver','80+ Gold','80+ Platinum','80+ Titanium']},{key:'Modular',label:'모듈러 방식',options:['No','Semi','Full']},{key:'Form Factor',label:'폼팩터',options:['ATX','SFX','SFX-L']},{key:'Color',label:'색상'}],
 CASE:[{key:'Form Factor',label:'폼팩터',options:['Mini ITX','Micro ATX','ATX Mid Tower','ATX Full Tower']},{key:'Color',label:'색상'},{key:'Internal 3.5\" Bays',label:'3.5인치 베이 수'},{key:'Side Panel',label:'사이드 패널 재질',options:['Tempered Glass','Acrylic','Mesh','Steel']},{key:'Max GPU Length',label:'GPU 최대 길이'}]
};
const category=document.querySelector('#product-category'),specFields=document.querySelector('#spec-fields');
function renderSpecs(){const name=category.selectedOptions[0]?.dataset.category||'';specFields.replaceChildren();(specDefinitions[name]||[{key:'Specification',label:'상세 사양'}]).forEach(def=>{const field=document.createElement('div');field.className='admin-field';if(def.liquidOnly)field.dataset.liquidOnly='true';const current=savedSpecs[def.key]||'';const selectedValue=name==='STORAGE'&&def.key==='Type'&&current&&current!=='SSD'?'HDD':current;const control=def.options?`<select class="admin-select" name="specValue">${def.options.map(value=>`<option value="${value}" ${value.toLowerCase()===selectedValue.toLowerCase()?'selected':''}>${value}</option>`).join('')}</select>`:`<input class="admin-input" name="specValue" value="${current}" placeholder="${def.label} 입력">`;field.innerHTML=`<label>${def.label}</label><input type="hidden" name="specKey" value="${def.key}">${control}`;specFields.append(field);});const coolerType=[...specFields.querySelectorAll('[name="specKey"]')].find(input=>input.value==='Type')?.parentElement.querySelector('[name="specValue"]');function toggleRadiator(){const radiator=specFields.querySelector('[data-liquid-only]');if(!radiator)return;const liquid=coolerType?.value==='Liquid';radiator.hidden=!liquid;radiator.querySelectorAll('input,select').forEach(input=>input.disabled=!liquid)}coolerType?.addEventListener('change',toggleRadiator);toggleRadiator();}
category.addEventListener('change',renderSpecs);renderSpecs();
const input=document.querySelector('#image-file'),dropzone=document.querySelector('#image-dropzone'),preview=document.querySelector('#image-preview');
function showImage(file){if(!file||!file.type.startsWith('image/'))return;const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;preview.src=URL.createObjectURL(file);preview.classList.remove('is-empty');}
input.addEventListener('change',()=>showImage(input.files[0]));['dragenter','dragover'].forEach(type=>dropzone.addEventListener(type,event=>{event.preventDefault();dropzone.classList.add('is-dragging')}));['dragleave','drop'].forEach(type=>dropzone.addEventListener(type,event=>{event.preventDefault();dropzone.classList.remove('is-dragging')}));dropzone.addEventListener('drop',event=>showImage(event.dataTransfer.files[0]));
</script>
</main></div></body></html>
