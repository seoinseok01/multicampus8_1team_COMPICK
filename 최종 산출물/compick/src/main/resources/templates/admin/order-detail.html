<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주문 상세 | COMPICK</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('orders')}"></aside><main class="admin-main"><header class="admin-page-head"><div class="admin-order-summary"><h1 th:text="${order.orderNumber}"></h1><span class="admin-badge" th:classappend="${order.orderStatus}" th:text="${order.orderStatus}"></span></div><form method="post" th:action="@{/admin/orders/{number}/status(number=${order.orderNumber})}"><select class="admin-select" name="status"><option th:each="value:${T(com.boot.compick.order.entity.OrderStatus).values()}" th:value="${value}" th:text="${value}" th:selected="${value==order.orderStatus}"></option></select> <button class="admin-button">상태 변경</button></form></header><p class="admin-message" th:if="${message}" th:text="${message}"></p>
<div class="admin-grid"><section class="admin-panel"><h2>주문자 / 배송지</h2><dl class="admin-kv"><dt>주문자</dt><dd th:text="|${member.name} (${T(com.boot.compick.admin.AdminPrivacyMasking).maskPhone(order.recipientPhone)})|"></dd><dt>배송지</dt><dd th:text="${T(com.boot.compick.admin.AdminPrivacyMasking).maskAddress(order.basicAddress)}"></dd><dt>요청사항</dt><dd th:text="${order.deliveryRequest?:'-'}"></dd></dl></section><section class="admin-panel"><h2>결제 정보</h2><dl class="admin-kv"><dt>결제수단</dt><dd th:text="${payment?.paymentMethod?:'-'}"></dd><dt>승인번호</dt><dd th:text="${payment?.approvalNumber?:'-'}"></dd><dt>결제상태</dt><dd><span class="admin-badge" th:text="${payment?.paymentStatus?:'미결제'}"></span></dd></dl></section></div>
<section class="admin-panel" style="margin-top:14px"><h2>주문 상품</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>구성</th><th>상품</th><th>단가</th><th>수량</th><th>소계</th></tr></thead><tbody th:each="group:${order.groups}"><tr th:each="item:${group.items}"><td th:text="${group.groupName}"></td><td th:text="${item.productName}"></td><td th:text="|${#numbers.formatInteger(item.orderPrice,1,'COMMA')}원|"></td><td th:text="${item.quantity}"></td><td th:text="|${#numbers.formatInteger(item.lineAmount,1,'COMMA')}원|"></td></tr></tbody><tfoot><tr><th colspan="4">상품금액 <span th:text="|${#numbers.formatInteger(order.productAmount,1,'COMMA')}원 · 배송비 ${#numbers.formatInteger(order.shippingFee,1,'COMMA')}원|"></span></th><th th:text="|합계 ${#numbers.formatInteger(order.finalAmount,1,'COMMA')}원|"></th></tr></tfoot></table></div></section>
</main></div></body></html>
