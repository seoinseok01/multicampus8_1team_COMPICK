<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원 상세 | COMPICK</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('members')}"></aside><main class="admin-main">
<header class="admin-page-head"><div><h1 th:text="|${member.name} (${member.loginId})|"></h1><small th:text="|가입일 ${#temporals.format(member.createdAt,'yyyy.MM.dd')}|"></small></div><form method="post" th:action="@{/admin/members/{id}(id=${member.id})}"><select class="admin-select" name="role"><option value="USER" th:selected="${member.role.name()=='USER'}">일반</option><option value="ADMIN" th:selected="${member.role.name()=='ADMIN'}">관리자</option></select> <select class="admin-select" name="status"><option value="ACTIVE" th:selected="${member.status.name()=='ACTIVE'}">활성</option><option value="INACTIVE" th:selected="${member.status.name()=='INACTIVE'}">정지</option><option value="WITHDRAWN" th:selected="${member.status.name()=='WITHDRAWN'}">탈퇴</option></select> <button class="admin-button">저장</button></form></header><p class="admin-message" th:if="${message}" th:text="${message}"></p>
<div class="admin-grid"><section class="admin-panel"><h2>기본 정보</h2><dl class="admin-kv"><dt>닉네임</dt><dd th:text="${member.nickname}"></dd><dt>이메일</dt><dd th:text="${T(com.boot.compick.admin.AdminPrivacyMasking).maskEmail(member.email)}"></dd><dt>연락처</dt><dd th:text="${T(com.boot.compick.admin.AdminPrivacyMasking).maskPhone(member.phone)}"></dd></dl></section><section class="admin-panel"><h2>배송지</h2><div th:each="address:${addresses}"><dl class="admin-kv"><dt th:text="${address.addressName}"></dt><dd th:text="${T(com.boot.compick.admin.AdminPrivacyMasking).maskAddress(address.basicAddress)}"></dd></dl></div><p class="admin-empty" th:if="${#lists.isEmpty(addresses)}">등록된 배송지가 없습니다.</p></section></div>
<section class="admin-panel" style="margin-top:14px"><h2>최근 주문 내역</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>주문번호</th><th>주문일</th><th>금액</th><th>상태</th></tr></thead><tbody><tr th:each="order:${orders}"><td><a class="admin-link" th:href="@{/admin/orders/{number}(number=${order.orderNumber})}" th:text="${order.orderNumber}"></a></td><td th:text="${#temporals.format(order.orderedAt,'yyyy.MM.dd')}"></td><td th:text="|${#numbers.formatInteger(order.finalAmount,1,'COMMA')}원|"></td><td><span class="admin-badge" th:classappend="${order.orderStatus}" th:text="${order.orderStatus}"></span></td></tr></tbody></table></div></section>
</main></div></body></html>
