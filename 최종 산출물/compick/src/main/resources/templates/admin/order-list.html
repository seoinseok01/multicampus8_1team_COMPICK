<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>주문/배송 관리 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
	<div class="admin-shell">
		<aside th:replace="~{admin/fragments :: sidebar('orders')}"></aside>
		<main class="admin-main">
			<header class="admin-page-head">
				<h1>주문/배송 관리</h1>
				<small th:text="|조회 ${totalElements}건|"></small>
			</header>
			<form class="admin-toolbar" method="get">
				<select class="admin-select" name="status">
					<option value="">전체 상태</option>
					<option value="PAYMENT_PENDING" th:selected="${status=='PAYMENT_PENDING'}">결제대기</option>
					<option value="PAID" th:selected="${status=='PAID'}">결제완료</option>
					<option value="PREPARING" th:selected="${status=='PREPARING'}">배송준비</option>
					<option value="SHIPPING" th:selected="${status=='SHIPPING'}">배송중</option>
					<option value="DELIVERED" th:selected="${status=='DELIVERED'}">배송완료</option>
					<option value="CANCELLED" th:selected="${status=='CANCELLED'}">취소</option>
				</select>
				<label class="admin-check"><input type="checkbox" name="returnRequested" value="true" th:checked="${returnRequested}"> 반품 요청만</label>
				<input class="admin-input" name="keyword" th:value="${keyword}" placeholder="주문번호, 회원명 검색">
				<button class="admin-button">검색</button>
			</form>
			<div class="admin-table-wrap">
				<table class="admin-table">
					<thead><tr><th>주문번호</th><th>회원</th><th>상품요약</th><th>금액</th><th>상태</th><th>주문일</th><th>관리</th></tr></thead>
					<tbody>
						<tr th:each="row:${orders}">
							<td th:text="${row.order.orderNumber}"></td>
							<td th:text="${row.memberName}"></td>
							<td th:text="${#lists.isEmpty(row.order.groups)?'-':row.order.groups[0].groupName}"></td>
							<td th:text="|${#numbers.formatInteger(row.order.finalAmount,1,'COMMA')}원|"></td>
							<td>
								<span class="admin-badge RETURN_REQUESTED" th:if="${row.order.returnRequested}">RETURNED</span>
								<span class="admin-badge" th:unless="${row.order.returnRequested}" th:classappend="${row.order.orderStatus}" th:text="${row.order.orderStatus}"></span>
							</td>
							<td th:text="${#temporals.format(row.order.orderedAt,'MM.dd HH:mm')}"></td>
							<td><a class="admin-link" th:href="@{/admin/orders/{number}(number=${row.order.orderNumber})}">상세</a></td>
						</tr>
					</tbody>
				</table>
			</div>
			<nav class="admin-pagination" th:if="${totalPages > 1}" aria-label="주문 목록 페이지">
				<a th:classappend="${currentPage == 1}?' is-disabled'" th:href="@{/admin/orders(page=${currentPage-1},keyword=${keyword},status=${status},returnRequested=${returnRequested})}">이전</a>
				<a th:each="number:${pageNumbers}" th:classappend="${number == currentPage}?' is-active'" th:text="${number}" th:href="@{/admin/orders(page=${number},keyword=${keyword},status=${status},returnRequested=${returnRequested})}"></a>
				<a th:classappend="${currentPage == totalPages}?' is-disabled'" th:href="@{/admin/orders(page=${currentPage+1},keyword=${keyword},status=${status},returnRequested=${returnRequested})}">다음</a>
			</nav>
		</main>
	</div>
</body>
</html>
