<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>회원가입 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/member.css}">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<script th:src="@{/js/member.js}" defer></script>
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="member-page">
		<section class="member-card wide" aria-labelledby="signup-title">
			<h1 id="signup-title">회원가입</h1>
			<p>필수 정보를 입력해 주세요.</p>

			<form class="member-form" th:action="@{/members/signup}"
				th:object="${signupForm}" method="post">
				<div class="form-message error" th:if="${#fields.hasGlobalErrors()}">
					<p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
				</div>

				<label for="loginId">아이디</label>
				<div class="field-with-button">
					<input id="loginId" th:field="*{loginId}" type="text"
						autocomplete="username" required>
					<button type="button" data-check-login-id>중복 확인</button>
				</div>
				<small class="field-result" data-login-id-result></small>
				<small class="field-error" th:errors="*{loginId}"></small>

				<label for="password">비밀번호</label>
				<input id="password" th:field="*{password}" type="password"
					autocomplete="new-password" required>
				<small class="field-error" th:errors="*{password}"></small>

				<label for="passwordConfirm">비밀번호 확인</label>
				<input id="passwordConfirm" th:field="*{passwordConfirm}"
					type="password" autocomplete="new-password" required>
				<small class="field-error" th:errors="*{passwordConfirm}"></small>

				<label for="name">이름</label>
				<input id="name" th:field="*{name}" type="text" required>
				<small class="field-error" th:errors="*{name}"></small>

				<label for="nickname">닉네임</label>
				<input id="nickname" th:field="*{nickname}" type="text" required>
				<small class="field-error" th:errors="*{nickname}"></small>

				<label for="email">이메일</label>
				<div class="field-with-button">
					<input id="email" th:field="*{email}" type="email" required>
					<button type="button" data-check-email>중복 확인</button>
				</div>
				<small class="field-result" data-email-result></small>
				<small class="field-error" th:errors="*{email}"></small>

				<label for="phone">휴대전화 번호</label>
				<input id="phone" th:field="*{phone}" type="tel"
					placeholder="010-1234-5678" required>
				<small class="field-error" th:errors="*{phone}"></small>

				<label class="check-label">
					<input th:field="*{termsAgreed}" type="checkbox" required>
					이용약관 및 개인정보 처리방침에 동의합니다.
				</label>
				<small class="field-error" th:errors="*{termsAgreed}"></small>

				<button class="primary-button" type="submit">가입하기</button>
			</form>
			<p class="member-link">이미 회원이신가요? <a th:href="@{/login}">로그인</a></p>
		</section>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
