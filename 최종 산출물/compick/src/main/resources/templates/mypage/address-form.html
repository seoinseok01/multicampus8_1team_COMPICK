<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${addressId == null} ? '배송지 등록 | COMPICK' : '배송지 수정 | COMPICK'">배송지 등록 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/member.css}">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
	<script th:src="@{/js/address-form.js}" defer></script>
</head>
<body th:data-address-id="${addressId}">
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="mypage">
		<h1 th:text="${addressId == null} ? '배송지 등록' : '배송지 수정'">배송지 등록</h1>
		<p class="subtitle">주문에 사용할 배송지 정보를 입력합니다.</p>

		<div class="mypage-layout">
			<div th:replace="~{fragments/mypage-sidebar :: mypageSidebar('addresses')}"></div>

			<section class="account-card mypage-content" aria-labelledby="address-form-title">
				<h2 id="address-form-title">배송지 정보</h2>
				<form class="member-form" id="address-form">
					<label for="addressName">배송지명</label>
					<input id="addressName" maxlength="50" placeholder="예: 집, 회사">

					<label for="recipientName">받는 사람</label>
					<input id="recipientName" maxlength="50" placeholder="이름 입력" required>

					<label for="addressPhone">휴대전화</label>
					<input id="addressPhone" type="tel" placeholder="010-0000-0000" required>

					<label for="zipCode">우편번호</label>
					<div class="field-with-button">
						<input id="zipCode" inputmode="numeric" maxlength="5" required readonly>
						<button type="button" data-address-search>주소 검색</button>
					</div>

					<label for="address1">기본 주소</label>
					<input id="address1" maxlength="255" placeholder="주소 검색 결과" required readonly>

					<label for="address2">상세 주소</label>
					<input id="address2" maxlength="255" placeholder="상세 주소 입력">

					<label class="check-label">
						<input id="isDefault" type="checkbox">
						기본 배송지로 설정
					</label>

					<p class="form-message" id="address-message" role="status"></p>
					<div class="form-actions">
						<a class="secondary-button" th:href="@{/mypage/addresses}">취소</a>
						<button class="primary-button" type="submit"
							th:text="${addressId == null} ? '등록 완료' : '수정 완료'">등록 완료</button>
					</div>
				</form>
			</section>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
