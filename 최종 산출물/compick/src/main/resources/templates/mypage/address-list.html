<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>배송지 관리 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/member.css}">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<script th:src="@{/js/address.js}" defer></script>
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="mypage">
		<h1>배송지 관리</h1>
		<p class="subtitle">배송지를 등록하고 기본 배송지를 설정합니다.</p>

		<div class="mypage-layout">
			<div th:replace="~{fragments/mypage-sidebar :: mypageSidebar('addresses')}"></div>

			<div class="mypage-content">
				<div class="page-heading">
					<h2 th:text="|등록된 배송지 ${#lists.size(addresses)}개|">등록된 배송지</h2>
					<a class="primary-button" th:href="@{/mypage/addresses/new}">새 배송지 등록</a>
				</div>

				<p class="summary-empty" th:if="${#lists.isEmpty(addresses)}">
					등록된 배송지가 없습니다.
				</p>
				<ul class="address-list" th:unless="${#lists.isEmpty(addresses)}">
					<li th:each="address : ${addresses}" th:data-address-id="${address.addressId()}">
						<div class="address-card-header">
							<h3 th:text="${address.addressName()}">배송지</h3>
							<span class="default-tag" th:if="${address.isDefault()}">기본 배송지</span>
						</div>
						<p th:text="|${address.recipientName()} · ${address.phone()}|"></p>
						<p th:text="|[${address.zipCode()}] ${address.address1()} ${address.address2() ?: ''}|"></p>
						<div class="address-actions">
							<a class="secondary-button"
								th:href="@{/mypage/addresses/{id}/edit(id=${address.addressId()})}">수정</a>
							<button type="button" data-address-delete>삭제</button>
							<button th:unless="${address.isDefault()}" type="button"
								data-address-default>기본 배송지 설정</button>
						</div>
					</li>
				</ul>
			</div>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
