<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${preset.quoteName} + ' | COMPICK'">추천 견적 상세 | COMPICK</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<meta name="quote-id" th:content="${preset.quoteId}">
	<script th:src="@{/js/preset-detail.js}" defer></script>
</head>
<body>
	<div th:replace="~{fragments/header :: siteHeader}"></div>
	<main class="recommendation-page">
		<section class="page-heading">
			<p>PRESET QUOT</p>
			<h1 th:text="${preset.quoteName}">추천 견적명</h1>
			<span th:text="${preset.summaryDescription}">한줄 설명</span>
		</section>

		<div class="preset-detail-layout">
			<section class="preset-detail-parts">
				<h2>구성 부품</h2>
				<ul class="preset-part-list">
					<li th:each="item : ${preset.items}">
						<span class="preset-part-category" th:text="${item.category}">CPU</span>
						<span
							class="preset-part-name"
							th:text="${item.quantity > 1} ? |${item.name} x${item.quantity}| : ${item.name}">부품명</span>
						<strong th:text="|${#numbers.formatInteger(item.price * item.quantity, 0, 'COMMA')}원|">0원</strong>
					</li>
				</ul>
			</section>

			<aside class="preset-detail-summary">
				<div class="preset-tag-row">
					<span class="preset-tag" th:switch="${preset.purposeTag}">
						<th:block th:case="'OFFICE'">사무용</th:block>
						<th:block th:case="'GAMING'">게이밍</th:block>
						<th:block th:case="'VIDEO_EDIT'">영상 편집</th:block>
						<th:block th:case="'BEGINNER'">입문용</th:block>
						<th:block th:case="*">추천 견적</th:block>
					</span>
					<span class="preset-tag" th:text="|약 ${#numbers.formatInteger(preset.totalPrice / 10000, 0, 'COMMA')}만원|">약 0만원</span>
				</div>

				<p th:text="${preset.summaryDescription}">설명</p>

				<div class="compatibility-banner is-pass">
					<strong>&#10003; 호환성 검사 통과</strong>
					<span>소켓·메모리 규격·파워 용량을 고려해 구성했습니다.</span>
				</div>

				<div class="quote-power-row">
					<span>예상 소비전력</span>
					<strong th:text="${preset.estimatedPowerWatt != null} ? |${preset.estimatedPowerWatt} W| : '-'">- W</strong>
				</div>

				<div class="quote-total-row">
					<span>총금액</span>
					<strong th:text="|${#numbers.formatInteger(preset.totalPrice, 0, 'COMMA')}원|">0원</strong>
				</div>

				<a
					class="preset-edit-button"
					th:href="@{/quotes/new(basedOn=${preset.quoteId})}">
					이 견적으로 수정하기
				</a>
				<button type="button" class="quote-submit-button" data-add-preset-to-cart>
					장바구니 담기
				</button>
			</aside>
		</div>
	</main>
	<p id="cart-feedback" class="cart-feedback" role="status" aria-live="polite" hidden></p>
	<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
